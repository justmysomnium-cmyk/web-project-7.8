<!doctype html>

<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>menu</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <div class="ic">
        <div class="ic__close">
          <img src="assets\icons\ic_close.svg" alt="close" />
        </div>
        <div class="ic__logo">
          <img src="assets\icons\logo.svg" alt="logo" />
        </div>
        <div class="ic__search">
          <img src="assets\icons\ic_search.svg" alt="search" />
        </div>
      </div>
    </header>
    <main>
      <menu>
        <div class="menu__repair">Ремонт техники</div>
        <div class="menu__services">Услуги и сервисы</div>
        <div class="menu__clients">Корпоративным клиентам</div>
        <div class="menu__sellers">Продавцам техники</div>
        <div class="menu__partners">Партнерам</div>
        <div class="menu__manufacturer">Производителям</div>
        <div class="menu__centers">Наши сервисные центры</div>
        <div class="menu__contacts">Контакты</div>
      </menu>
    </main>
    <footer>
      <div class="footer__ic">
        <div class="footeric__call">
          <img src="assets\icons\ic-call.svg" alt="call" />
        </div>
        <div class="footeric__message">
          <img src="assets\icons\ic-message.svg" alt="message" />
        </div>
        <div class="footeric__contacts">
          <img src="assets\icons\ic-contacts.svg" alt="contacts" />
        </div>
      </div>
      <div class="footer__mail">mail@cps.com</div>
      <div class="footer__number">8 800 890 8900</div>
      <div class="footer__languages">
        <div class="language__ru">RU</div>
        <div class="language__eng">EN</div>
        <div class="language__ch">CH</div>
      </div>
    </footer>
  </body>
</html>
